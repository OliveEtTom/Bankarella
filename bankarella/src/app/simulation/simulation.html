<div class="Simulation">
    <div class="Simulation__content">
        <div class="Simulation__info">
            <h2>{{ data.name | titlecase }}</h2>

            <div class="Simulation__stat">
                <span class="Simulation__label">Amount</span>
                <span class="Simulation__value">{{ data.amount | currency }}</span>
            </div>

            <div class="Simulation__stat">
                <span class="Simulation__label">Rate</span>
                <span class="Simulation__value">{{ data.interestRate / 100 | percent : '0.2' }}</span>
            </div>

            <div class="Simulation__stat">
                <span class="Simulation__label">Duration</span>
                <span class="Simulation__value">{{ data.duration }} months</span>
            </div>

            @if (data.insurance) {
            <div class="Simulation__stat">
                <span class="Simulation__label">Insurance</span>
                <span class="Simulation__value">{{ data.insurance / 100.0 | percent : '0.2' }}</span>
            </div>
            }
            <div class="Simulation__actions">
                <button class="Simulation__button" (click)="computeMonthlyPayment()" [disabled]="computing"
                    [attr.aria-busy]="computing">
                    <span class="Simulation__button-spinner" *ngIf="computing" aria-hidden="true"></span>
                    <span class="Simulation__button-icon" *ngIf="!computing && computedMonthlyPayment">✔</span>
                    <span class="Simulation__button-label">{{ computing ? 'Computing…' : (computedMonthlyPayment ?
                        'Recompute' : 'Compute Monthly Payment') }}</span>
                </button>
            </div>
            <div class="Simulation__stat">
                <span class="Simulation__label">Monthly Payment</span>
                <span class="Simulation__value">{{ monthlyPayment() | currency }}</span>
            </div>
        </div>

        <div class="Simulation__plot">
            <plotly-plot [data]="graph.data" [layout]="graph.layout"></plotly-plot>
        </div>
    </div>
</div>
